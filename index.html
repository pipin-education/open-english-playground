
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open English Playground</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff8e9;
      color: #344054;
      text-align: center;
      padding: 30px 15px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 4px 15px #00000012;
    }

    h1 { color: #ed8b36; }

    .subtitle { color: #667085; }

    .choices {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin: 25px 0;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 17px;
      cursor: pointer;
      background: #e8efff;
    }

    button:hover { background: #d5e2ff; }

    #feedback {
      font-size: 20px;
      font-weight: bold;
      min-height: 30px;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>🌈 Open English Playground</h1>
    <p class="subtitle">
      Learn English through fun activities!
    </p>

    <h2>What color is this?</h2>

    <div style="font-size: 90px;">🔴</div>

    <div class="choices">
      <button onclick="checkAnswer('Blue')">Blue</button>
      <button onclick="checkAnswer('Red')">Red</button>
      <button onclick="checkAnswer('Green')">Green</button>
      <button onclick="checkAnswer('Yellow')">Yellow</button>
    </div>

    <p id="feedback">
      Choose the correct answer!
    </p>
  </main>

  <script>
    function checkAnswer(answer) {
      const feedback = document.getElementById("feedback");

      if (answer === "Red") {
        feedback.textContent = "🎉 Excellent! The answer is RED!";
        feedback.style.color = "green";
      } else {
        feedback.textContent = "😊 Try again! You can do it!";
        feedback.style.color = "orange";
      }
    }
  </script>
</body>
</html>
