
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="An interactive English learning playground for young learners.">

  <title>Open English Playground</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <main class="container">

    <h1>🌈 Open English Playground</h1>

    <p class="subtitle">
      Learn English through fun activities!
    </p>

    <section aria-labelledby="quiz-title">

      <h2 class="question" id="quiz-title">
        What color is this?
      </h2>

      <div class="color-display" role="img" aria-label="Red circle">
        🔴
      </div>

      <div class="choices">
        <button type="button" onclick="checkAnswer('Blue')">
          Blue
        </button>

        <button type="button" onclick="checkAnswer('Red')">
          Red
        </button>

        <button type="button" onclick="checkAnswer('Green')">
          Green
        </button>

        <button type="button" onclick="checkAnswer('Yellow')">
          Yellow
        </button>
      </div>

      <p id="feedback" aria-live="polite">
        Choose the correct answer!
      </p>

    </section>

  </main>
</body>
</html>
